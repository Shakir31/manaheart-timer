      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; margin: -4px -10px 0 0; border: none; background: transparent; color: #9BA0C8; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>

      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="8" fill="#7FD4FF" opacity="0.25"></circle><circle cx="11" cy="11" r="3.5" fill="#F4FBFF"></circle></svg>
