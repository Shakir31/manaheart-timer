<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070914}
a{color:#9FDCFF}a:hover{color:#CFEAFF}
.v-flow{animation:vflow 30s linear infinite}
.v-flow-r{animation:vflowr 42s linear infinite}
.v-fast{animation:vflow 9s linear infinite}
.v-fast-r{animation:vflowr 12s linear infinite}
.v-wob{transform-origin:200px 200px;animation:vwob 6.5s ease-in-out infinite alternate}
.v-sway{transform-origin:200px 200px;animation:vsway 7s ease-in-out infinite alternate}
.v-sway2{transform-origin:200px 200px;animation:vsway 9s ease-in-out infinite alternate-reverse}
.v-flick{animation:vflick 3.4s steps(1,end) infinite}
.v-breathe{transform-origin:200px 200px;animation:vbreathe 5s ease-in-out infinite alternate}
.v-spin{transform-origin:200px 200px;animation:vspin 60s linear infinite}
.v-spin-r{transform-origin:200px 200px;animation:vspin 80s linear infinite reverse}
.v-ember{animation:vember 4s ease-in infinite}
.v-tw{animation:vtw 4s ease-in-out infinite alternate}
@keyframes vflow{to{stroke-dashoffset:-400}}
@keyframes vflowr{to{stroke-dashoffset:400}}
@keyframes vwob{0%{transform:rotate(-2.4deg) translate(1px,-1px)}100%{transform:rotate(2.8deg) translate(-2px,2px)}}
@keyframes vsway{0%{transform:translate(0,-4px) rotate(-1.5deg)}100%{transform:translate(0,4px) rotate(1.5deg)}}
@keyframes vflick{0%{opacity:1}12%{opacity:.45}15%{opacity:.95}48%{opacity:.7}51%{opacity:.3}54%{opacity:.85}80%{opacity:.6}}
@keyframes vbreathe{from{transform:scale(1);opacity:.88}to{transform:scale(1.06);opacity:1}}
@keyframes vspin{to{transform:rotate(360deg)}}
@keyframes vember{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes vtw{from{opacity:.1}to{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 1360px; height: 720px; box-sizing: border-box; background: #070914; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; padding: 48px 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px">

        <g transform="rotate(-18 200 200)">
          <ellipse cx="200" cy="200" rx="90" ry="30" stroke="#A98BFF" stroke-width="1"></ellipse>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">

    </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 24px 16px 28px; border: 1px solid #1C2150; border-radius: 24px; background: #0A0C1C">
    <svg viewBox="0 0 400 400" width="370" height="370" role="img" aria-label="Spirit heart: soft nebula rings in pale teal and silver that drift; two stable, one unstable and misty">
      <defs>
        <radialGradient id="pHalo"><stop offset="0" stop-color="#F2FBF8" stop-opacity="0.8"></stop><stop offset="0.3" stop-color="#9FE6D6" stop-opacity="0.28"></stop><stop offset="0.7" stop-color="#3C7F8F" stop-opacity="0.08"></stop><stop offset="1" stop-color="#3C7F8F" stop-opacity="0"></stop></radialGradient>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">

      <div style="font-size: 14px; color: #9BA0C8; max-width: 300px">Soft nebula bands that drift and sway. Unstable rings thin into mist.</div>
