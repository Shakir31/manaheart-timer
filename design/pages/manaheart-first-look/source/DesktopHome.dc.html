<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manaheart · Home (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070914}
a{color:#9BA0C8}a:hover{color:#E8E6F4}
.mh-flow{animation:mhflow 40s linear infinite}
.mh-flow-r{animation:mhflowr 55s linear infinite}
.mh-wob{transform-origin:200px 200px;animation:mhwob 6.5s ease-in-out infinite alternate}
.mh-flick{animation:mhflick 3.4s steps(1,end) infinite}
.mh-breathe{transform-origin:200px 200px;animation:mhbreathe 5s ease-in-out infinite alternate}
.mh-tw{animation:mhtw 4s ease-in-out infinite alternate}
.mh-form{animation:mhform 2.6s ease-in-out infinite alternate}
@keyframes mhflow{to{stroke-dashoffset:-400}}
@keyframes mhflowr{to{stroke-dashoffset:400}}
@keyframes mhwob{0%{transform:rotate(-2.2deg) translate(1px,-1px)}100%{transform:rotate(2.6deg) translate(-2px,1px)}}
@keyframes mhflick{0%{opacity:1}12%{opacity:.45}15%{opacity:.95}48%{opacity:.7}51%{opacity:.3}54%{opacity:.85}80%{opacity:.6}}
@keyframes mhbreathe{from{transform:scale(1);opacity:.88}to{transform:scale(1.06);opacity:1}}
@keyframes mhtw{from{opacity:.12}to{opacity:.9}}
@keyframes mhform{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #070914; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; padding: 0 clamp(16px, 4vw, 48px); overflow: hidden">
  <header style="max-width: 1200px; margin: 0 auto; height: 80px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #141838">
    <div style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 500; letter-spacing: 0.1em">Manaheart</div>
    <nav aria-label="Main" style="display: flex; align-items: center; gap: 8px">
      <a href="#" aria-current="page" style="height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 14px; font-weight: 500; color: #E8E6F4; text-decoration: none">Heart</a>
      <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 14px; font-weight: 500; text-decoration: none">Sessions</a>
      <button aria-label="Settings" style="width: 44px; height: 44px; border: none; background: transparent; color: #9BA0C8; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      </button>
    </nav>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 72px; padding: 40px 0 56px">
    <div style="flex: 999 1 520px; min-width: 0; display: flex; justify-content: center">
      <svg viewBox="0 0 400 400" role="img" aria-label="Mana heart with three circles: two stable, one unstable, and a fourth circle forming" style="width: 100%; max-width: 640px; height: auto">
        <defs>
          <radialGradient id="dhHalo"><stop offset="0" stop-color="#EAF8FF" stop-opacity="0.85"></stop><stop offset="0.22" stop-color="#9FDCFF" stop-opacity="0.4"></stop><stop offset="0.6" stop-color="#4C6BFF" stop-opacity="0.1"></stop><stop offset="1" stop-color="#4C6BFF" stop-opacity="0"></stop></radialGradient>
          <filter id="dhGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
        </defs>
        <circle cx="200" cy="200" r="125" fill="url(#dhHalo)"></circle>
        <g filter="url(#dhGlow)" fill="none">
          <g transform="rotate(58 200 200)">
            <ellipse cx="200" cy="200" rx="164" ry="64" stroke="{{mana}}" stroke-width="0.7" stroke-dasharray="1 6" opacity="0.18"></ellipse>
            <ellipse class="mh-form" cx="200" cy="200" rx="164" ry="64" stroke="{{mana}}" stroke-width="1" stroke-dasharray="230 2000" stroke-linecap="round"></ellipse>
            <circle class="mh-tw" cx="364" cy="200" r="2" fill="#F4FBFF"></circle>
            <circle class="mh-tw" cx="358" cy="190" r="1" fill="#CFEAFF" style="animation-delay: -1.5s"></circle>
          </g>
          <g transform="rotate(-38 200 200)">
            <g class="mh-wob"><g class="mh-flick">
              <ellipse cx="200" cy="200" rx="142" ry="54" stroke="{{mana}}" stroke-width="0.9" stroke-dasharray="34 10 8 16 52 7 14 22 40 12" opacity="0.6"></ellipse>
              <ellipse cx="200" cy="200" rx="148" ry="58" stroke="{{mana}}" stroke-width="1.4" stroke-dasharray="1 13 3 23" opacity="0.35"></ellipse>
            </g></g>
          </g>
          <g transform="rotate(24 200 200)">
            <ellipse cx="200" cy="200" rx="118" ry="42" stroke="{{mana}}" stroke-width="1"></ellipse>
            <ellipse class="mh-flow-r" cx="200" cy="200" rx="123" ry="45" stroke="{{mana}}" stroke-width="1.8" stroke-dasharray="2 6 2 10" opacity="0.55"></ellipse>
          </g>
          <g transform="rotate(-18 200 200)">
            <ellipse cx="200" cy="200" rx="90" ry="30" stroke="{{mana}}" stroke-width="1"></ellipse>
            <ellipse class="mh-flow" cx="200" cy="200" rx="95" ry="33" stroke="{{mana}}" stroke-width="1.8" stroke-dasharray="1 7 5 7" opacity="0.55"></ellipse>
          </g>
        </g>
        <g class="mh-breathe" filter="url(#dhGlow)" fill="none">
          <circle cx="200" cy="200" r="27" stroke="#9FDCFF" stroke-width="0.7" opacity="0.7"></circle>
          <path d="M200 168 L219 200 L200 232 L181 200 Z" stroke="#DFF4FF" stroke-width="1.1"></path>
          <path d="M181 200 L219 200 M200 168 L200 232" stroke="#DFF4FF" stroke-width="0.5" opacity="0.6"></path>
          <circle cx="200" cy="200" r="9" fill="#F4FBFF"></circle>
        </g>
        <g fill="#CFEAFF">
          <circle class="mh-tw" cx="70" cy="120" r="1.1"></circle>
          <circle class="mh-tw" cx="320" cy="96" r="0.9" style="animation-delay: -1s"></circle>
          <circle class="mh-tw" cx="104" cy="318" r="1.2" style="animation-delay: -2.2s"></circle>
          <circle class="mh-tw" cx="300" cy="334" r="0.8" style="animation-delay: -3s"></circle>
          <circle class="mh-tw" cx="40" cy="236" r="0.8" style="animation-delay: -2.8s"></circle>
        </g>
      </svg>
    </div>

    <div style="flex: 1 1 340px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #9BA0C8">Level 1</div>
        <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 64px; line-height: 1; color: #F1EFFA">Apprentice</h1>
        <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #9BA0C8">Three circles turn. The third still wavers.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 14px; color: #E8E6F4">Fourth circle forming</div>
          <div style="font-size: 14px; color: #9BA0C8; font-variant-numeric: tabular-nums">6h 40m <span style="color: #7D83AF">/ 10h</span></div>
        </div>
        <div style="height: 2px; background: #1D2350; border-radius: 2px; position: relative">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 66%; background: {{mana}}; border-radius: 2px; box-shadow: 0 0 10px {{mana}}"></div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 18px 20px; border: 1px solid #1C2150; border-radius: 18px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8">Rhythm</div>
          <div style="font-size: 14px">5 of 7 days</div>
        </div>
        <div style="display: flex; gap: 12px" role="img" aria-label="Practised on 5 of the last 7 days; missed Wednesday and Saturday">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: {{mana}}; box-shadow: 0 0 6px {{mana}}"></div><div style="font-size: 11px; color: #7D83AF">M</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: {{mana}}; box-shadow: 0 0 6px {{mana}}"></div><div style="font-size: 11px; color: #7D83AF">T</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px solid #5A619A"></div><div style="font-size: 11px; color: #7D83AF">W</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: {{mana}}; box-shadow: 0 0 6px {{mana}}"></div><div style="font-size: 11px; color: #7D83AF">T</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: {{mana}}; box-shadow: 0 0 6px {{mana}}"></div><div style="font-size: 11px; color: #7D83AF">F</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px solid #5A619A"></div><div style="font-size: 11px; color: #7D83AF">S</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: {{mana}}; box-shadow: 0 0 6px {{mana}}"></div><div style="font-size: 11px; color: #E8E6F4">S</div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9BA0C8"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="{{mana}}" stroke-width="1.2"></circle></svg>2 stable</div>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9BA0C8"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="{{mana}}" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"></circle></svg>1 unstable</div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <button style="flex: 1 1 200px; height: 56px; border: none; border-radius: 28px; background: #CFEAFF; color: #070914; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 600; box-shadow: 0 0 36px rgba(127, 212, 255, 0.35); cursor: pointer">Begin session</button>
        <button style="flex: 0 1 160px; height: 56px; border: 1px solid #3A4180; border-radius: 28px; background: transparent; color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">Log manually</button>
      </div>

      <div style="display: flex; flex-direction: column">
        <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8; padding-bottom: 8px">Recent</div>
        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #141838; font-size: 14px"><span>Study</span><span style="color: #9BA0C8; font-variant-numeric: tabular-nums">45 min · Today, 6:30 am</span></div>
        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #141838; font-size: 14px"><span>Meditation</span><span style="color: #9BA0C8; font-variant-numeric: tabular-nums">20 min · Yesterday, 9:10 pm</span></div>
        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #141838; border-bottom: 1px solid #141838; font-size: 14px"><span>Study</span><span style="color: #9BA0C8; font-variant-numeric: tabular-nums">1h 30m · Sun, 2:00 pm</span></div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mana":{"editor":"color","default":"#7FD4FF","options":["#7FD4FF","#A98BFF","#FFB070","#9FE6D6"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { mana: this.props.mana ?? '#7FD4FF' };
  }
}
</script>
</body>
</html>
