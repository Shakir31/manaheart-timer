<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manaheart · Session complete (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070914}
a{color:#9BA0C8}a:hover{color:#E8E6F4}
.mh-flow{animation:mhflow 40s linear infinite}
.mh-flow-r{animation:mhflowr 55s linear infinite}
.mh-wob{transform-origin:200px 200px;animation:mhwob 6.5s ease-in-out infinite alternate}
.mh-flick{animation:mhflick 3.4s steps(1,end) infinite}
.mh-breathe{transform-origin:200px 200px;animation:mhbreathe 3s ease-in-out infinite alternate}
.mh-stream{animation:mhstream 2.4s linear infinite}
.mh-stream2{animation:mhstream 3.4s linear infinite}
.mh-tw{animation:mhtw 1.6s ease-in-out infinite alternate}
.mh-rise{animation:mhrise 1.8s ease-out both}
@keyframes mhflow{to{stroke-dashoffset:-400}}
@keyframes mhflowr{to{stroke-dashoffset:400}}
@keyframes mhstream{to{stroke-dashoffset:-120}}
@keyframes mhwob{0%{transform:rotate(-2.2deg)}100%{transform:rotate(2.6deg)}}
@keyframes mhflick{0%{opacity:1}12%{opacity:.45}15%{opacity:.95}48%{opacity:.7}51%{opacity:.3}54%{opacity:.85}80%{opacity:.6}}
@keyframes mhbreathe{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes mhtw{from{opacity:.3}to{opacity:1}}
@keyframes mhrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #070914; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; padding: 48px clamp(16px, 4vw, 48px); display: flex; align-items: center; overflow: hidden">
  <div style="max-width: 1200px; width: 100%; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 40px 80px">
    <div style="flex: 999 1 480px; min-width: 0; display: flex; justify-content: center">
      <svg viewBox="0 0 400 470" role="img" aria-label="Mana flowing up from the session into the forming fourth circle, which brightens and lengthens" style="width: 100%; max-width: 580px; height: auto">
        <defs>
          <radialGradient id="dcHalo"><stop offset="0" stop-color="#EAF8FF" stop-opacity="0.9"></stop><stop offset="0.22" stop-color="#9FDCFF" stop-opacity="0.45"></stop><stop offset="0.6" stop-color="#4C6BFF" stop-opacity="0.12"></stop><stop offset="1" stop-color="#4C6BFF" stop-opacity="0"></stop></radialGradient>
          <radialGradient id="dcSpark"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.4" stop-color="#9FDCFF" stop-opacity="0.6"></stop><stop offset="1" stop-color="#9FDCFF" stop-opacity="0"></stop></radialGradient>
          <filter id="dcGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
        </defs>
        <circle cx="200" cy="200" r="125" fill="url(#dcHalo)"></circle>
        <g filter="url(#dcGlow)" fill="none">
          <path class="mh-stream" d="M200 470 C 205 430, 250 390, 287 339" stroke="#CFEAFF" stroke-width="1.4" stroke-dasharray="2 10" stroke-linecap="round"></path>
          <path class="mh-stream2" d="M180 470 C 170 420, 240 380, 284 345" stroke="#7FD4FF" stroke-width="0.9" stroke-dasharray="1 11" stroke-linecap="round" opacity="0.8"></path>
          <path class="mh-stream2" d="M222 470 C 240 430, 270 400, 290 342" stroke="#7FD4FF" stroke-width="0.9" stroke-dasharray="1 7 1 15" stroke-linecap="round" opacity="0.7"></path>
          <g transform="rotate(58 200 200)">
            <ellipse cx="200" cy="200" rx="164" ry="64" stroke="#7FD4FF" stroke-width="0.7" stroke-dasharray="1 6" opacity="0.2"></ellipse>
            <ellipse cx="200" cy="200" rx="164" ry="64" stroke="#BFE6FF" stroke-width="1.4" stroke-dasharray="270 2000" stroke-linecap="round"></ellipse>
          </g>
          <circle class="mh-tw" cx="287" cy="339" r="14" fill="url(#dcSpark)" stroke="none"></circle>
          <g transform="rotate(-38 200 200)"><g class="mh-wob"><g class="mh-flick">
            <ellipse cx="200" cy="200" rx="142" ry="54" stroke="#7FD4FF" stroke-width="0.9" stroke-dasharray="34 10 8 16 52 7 14 22 40 12" opacity="0.6"></ellipse>
          </g></g></g>
          <g transform="rotate(24 200 200)">
            <ellipse cx="200" cy="200" rx="118" ry="42" stroke="#7FD4FF" stroke-width="1"></ellipse>
            <ellipse class="mh-flow-r" cx="200" cy="200" rx="123" ry="45" stroke="#7FD4FF" stroke-width="1.8" stroke-dasharray="2 6 2 10" opacity="0.55"></ellipse>
          </g>
          <g transform="rotate(-18 200 200)">
            <ellipse cx="200" cy="200" rx="90" ry="30" stroke="#7FD4FF" stroke-width="1"></ellipse>
            <ellipse class="mh-flow" cx="200" cy="200" rx="95" ry="33" stroke="#7FD4FF" stroke-width="1.8" stroke-dasharray="1 7 5 7" opacity="0.55"></ellipse>
          </g>
        </g>
        <g class="mh-breathe" filter="url(#dcGlow)" fill="none">
          <circle cx="200" cy="200" r="27" stroke="#9FDCFF" stroke-width="0.7" opacity="0.8"></circle>
          <path d="M200 168 L219 200 L200 232 L181 200 Z" stroke="#EAF8FF" stroke-width="1.2"></path>
          <circle cx="200" cy="200" r="10" fill="#FFFFFF"></circle>
        </g>
      </svg>
    </div>

    <div class="mh-rise" style="flex: 1 1 340px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #9BA0C8">Session complete</div>
        <div style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 88px; line-height: 1; color: #F1EFFA; text-shadow: 0 0 30px rgba(127, 212, 255, 0.45)">+45 min</div>
        <div style="font-size: 15px; color: #9BA0C8">Study · flowed into the fourth circle</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px">Fourth circle</div>
          <div style="font-size: 14px; color: #9BA0C8; font-variant-numeric: tabular-nums">7h 25m <span style="color: #7D83AF">/ 10h</span></div>
        </div>
        <div style="height: 2px; background: #1D2350; border-radius: 2px; position: relative">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 66%; background: #7FD4FF; border-radius: 2px 0 0 2px"></div>
          <div style="position: absolute; left: 66%; top: -1px; bottom: -1px; width: 8%; background: #F4FBFF; border-radius: 2px; box-shadow: 0 0 12px #9FDCFF"></div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: #9BA0C8">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4" fill="#7FD4FF"></circle></svg>
          Rhythm kept · 6 of the last 7 days
        </div>
      </div>

      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <button style="flex: 1 1 200px; height: 56px; border: 1px solid #9FDCFF; border-radius: 28px; background: transparent; color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 500; cursor: pointer">Return to the heart</button>
        <button style="flex: 0 1 140px; height: 56px; border: none; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Add a note</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
