<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manaheart · The circle is stable (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mh.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#05060F}a{color:#9FDCFF}a:hover{color:#CFEAFF}</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #05060F; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden">
  <button aria-label="Continue" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: transparent; cursor: pointer; padding: 0"></button>
  <div style="position: relative; min-height: 900px; box-sizing: border-box; padding: 64px 24px 48px; display: flex; flex-direction: column; align-items: center; text-align: center; pointer-events: none">
    <div class="mh-fade" style="font-size: 12px; font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: #9BA0C8">Milestone · First circle</div>
    <div style="margin-top: 20px; width: 100%; display: flex; justify-content: center">
      <dc-import name="Heart" circles="{{ 1 }}" unstable-ring="{{ 0 }}" forming="{{ 0 }}" size="500px" label="The first circle now turns clean and even" hint-size="500px,500px"></dc-import>
    </div>
    <h1 class="mh-rise" style="margin: 16px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: clamp(42px, 5vw, 68px); line-height: 1.05; color: #F1EFFA; text-shadow: 0 0 32px rgba(127, 212, 255, 0.35)">The circle is stable</h1>
    <p class="mh-rise" style="margin: 14px 0 0; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 22px; color: #9BA0C8">Your rhythm held. It turns clean and even now.</p>
    <div style="flex-grow: 1; min-height: 32px"></div>
    <div style="font-size: 13px; color: #7D83AF">Click anywhere or press Enter to continue</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
