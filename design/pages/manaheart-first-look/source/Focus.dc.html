<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070914}
a{color:#9FDCFF}a:hover{color:#CFEAFF}
.mh-flow{animation:mhflow 70s linear infinite}
.mh-flow-r{animation:mhflowr 90s linear infinite}
.mh-wob{transform-origin:200px 200px;animation:mhwob 8s ease-in-out infinite alternate}
.mh-pulse{transform-origin:200px 200px;animation:mhpulse 6s ease-in-out infinite alternate}
@keyframes mhflow{to{stroke-dashoffset:-400}}
@keyframes mhflowr{to{stroke-dashoffset:400}}
@keyframes mhwob{0%{transform:rotate(-2deg)}100%{transform:rotate(2.4deg)}}
@keyframes mhpulse{from{transform:scale(.97);opacity:.55}to{transform:scale(1.03);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #05060F; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden">

        <ellipse class="mh-flow-r" transform="rotate(24 200 200)" cx="200" cy="200" rx="118" ry="42" stroke-width="1.2" stroke-dasharray="40 4 2 4"></ellipse>
        <ellipse class="mh-flow" transform="rotate(-18 200 200)" cx="200" cy="200" rx="90" ry="30" stroke-width="1.2" stroke-dasharray="30 3 1 3 3 3"></ellipse>
      </g>
      <path d="M200 168 L219 200 L200 232 L181 200 Z" fill="none" stroke="#DFF4FF" stroke-width="1.2"></path>
      <circle cx="200" cy="200" r="9" fill="#F4FBFF"></circle>

      Meditation
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="font-weight: 200; font-size: 84px; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: #F1EFFA; text-shadow: 0 0 28px rgba(127, 212, 255, 0.35)">24:37</div>
      <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #9BA0C8">Mana gathering</div>
    </div>

    <div style="font-size: 12px; color: #7D83AF; margin-bottom: 28px; font-variant-numeric: tabular-nums">Begun 7:42 pm · flows into the fourth circle</div>

    <div style="display: grid; grid-template-columns: 130px 72px 130px; align-items: center; justify-items: center; gap: 12px">

    </div>
  </div>
