<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manaheart · Session complete</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070914}
a{color:#9FDCFF}a:hover{color:#CFEAFF}
.mh-flow{animation:mhflow 40s linear infinite}
.mh-flow-r{animation:mhflowr 55s linear infinite}
.mh-wob{transform-origin:200px 200px;animation:mhwob 6.5s ease-in-out infinite alternate}
.mh-flick{animation:mhflick 3.4s steps(1,end) infinite}
.mh-breathe{transform-origin:200px 200px;animation:mhbreathe 3s ease-in-out infinite alternate}
.mh-stream{animation:mhstream 2.4s linear infinite}
.mh-stream2{animation:mhstream 3.4s linear infinite}
.mh-tw{animation:mhtw 1.6s ease-in-out infinite alternate}
.mh-rise{animation:mhrise 1.8s ease-out both}
@keyframes mhflow{to{stroke-dashoffset:-400}}
@keyframes mhflowr{to{stroke-dashoffset:400}}
@keyframes mhstream{to{stroke-dashoffset:-120}}
@keyframes mhwob{0%{transform:rotate(-2.2deg)}100%{transform:rotate(2.6deg)}}
@keyframes mhflick{0%{opacity:1}12%{opacity:.45}15%{opacity:.95}48%{opacity:.7}51%{opacity:.3}54%{opacity:.85}80%{opacity:.6}}
@keyframes mhbreathe{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes mhtw{from{opacity:.3}to{opacity:1}}
@keyframes mhrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</helmet>

    </defs>

      <path class="mh-stream" d="M200 470 C 205 430, 250 390, 287 339" stroke="#CFEAFF" stroke-width="1.6" stroke-dasharray="2 10" stroke-linecap="round"></path>
      <path class="mh-stream2" d="M180 470 C 170 420, 240 380, 284 345" stroke="#7FD4FF" stroke-width="1" stroke-dasharray="1 11" stroke-linecap="round" opacity="0.8"></path>

      </g>
      <circle class="mh-tw" cx="287" cy="339" r="14" fill="url(#cSpark)" stroke="none"></circle>
      <g transform="rotate(-38 200 200)">
        <g class="mh-wob"><g class="mh-flick">
          <ellipse cx="200" cy="200" rx="142" ry="54" stroke="#7FD4FF" stroke-width="1" stroke-dasharray="34 10 8 16 52 7 14 22 40 12" opacity="0.6"></ellipse>
        </g></g>
      </g>
      <g transform="rotate(24 200 200)">

      </g>
    </g>
    <g class="mh-breathe" filter="url(#cGlow)" fill="none">
      <circle cx="200" cy="200" r="27" stroke="#9FDCFF" stroke-width="0.8" opacity="0.8"></circle>
      <path d="M200 168 L219 200 L200 232 L181 200 Z" stroke="#EAF8FF" stroke-width="1.3"></path>
      <circle cx="200" cy="200" r="10" fill="#FFFFFF"></circle>
    </g>
  </svg>

  <div class="mh-rise" style="display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: -6px">
    <div style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 64px; line-height: 1; color: #F1EFFA; text-shadow: 0 0 24px rgba(127, 212, 255, 0.45); font-variant-numeric: lining-nums">+45 min</div>
    <div style="font-size: 14px; color: #9BA0C8">Study · flowed into the fourth circle</div>
  </div>

  <div style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 30px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px">Fourth circle</div>
      <div style="font-size: 13px; color: #9BA0C8; font-variant-numeric: tabular-nums">7h 25m <span style="color: #7D83AF">/ 10h</span></div>
    </div>
    <div style="height: 2px; background: #1D2350; border-radius: 2px; position: relative">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 66%; background: #7FD4FF; border-radius: 2px 0 0 2px"></div>
      <div style="position: absolute; left: 66%; top: -1px; bottom: -1px; width: 8%; background: #F4FBFF; border-radius: 2px; box-shadow: 0 0 12px #9FDCFF"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: #9BA0C8">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="4" fill="#7FD4FF"></circle></svg>

  <button style="width: 100%; height: 56px; border: 1px solid #9FDCFF; border-radius: 28px; background: transparent; color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 500; cursor: pointer">Return to the heart</button>
</div>
