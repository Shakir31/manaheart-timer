<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manaheart · Log a session (desktop)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070914}
a{color:#9BA0C8}a:hover{color:#E8E6F4}
input::placeholder,textarea::placeholder{color:#7D83AF}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #070914; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 48px 16px">
  <div aria-hidden="true" style="position: absolute; inset: 0; opacity: 0.35; padding: 0 clamp(16px, 4vw, 48px)">
    <div style="max-width: 1200px; margin: 0 auto; height: 80px; display: flex; align-items: center; border-bottom: 1px solid #141838; font-family: 'Cormorant Garamond', serif; font-size: 24px; letter-spacing: 0.1em">Manaheart</div>
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 72px; padding-top: 40px">
      <svg viewBox="0 0 400 400" style="flex: 999 1 520px; max-width: 640px; height: auto">
        <g fill="none" stroke="#7FD4FF" stroke-width="0.9">
          <ellipse transform="rotate(-18 200 200)" cx="200" cy="200" rx="90" ry="30"></ellipse>
          <ellipse transform="rotate(24 200 200)" cx="200" cy="200" rx="118" ry="42"></ellipse>
          <ellipse transform="rotate(-38 200 200)" cx="200" cy="200" rx="142" ry="54" stroke-dasharray="34 10 8 16 52 7" opacity="0.6"></ellipse>
          <ellipse transform="rotate(58 200 200)" cx="200" cy="200" rx="164" ry="64" stroke-dasharray="230 2000"></ellipse>
        </g>
        <circle cx="200" cy="200" r="9" fill="#F4FBFF"></circle>
      </svg>
      <div style="flex: 1 1 340px; font-family: 'Cormorant Garamond', serif; font-size: 64px; color: #F1EFFA">Apprentice</div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(3, 4, 12, 0.62)"></div>

  <form role="dialog" aria-modal="true" aria-labelledby="dlTitle" style="position: relative; width: 100%; max-width: 520px; box-sizing: border-box; background: #0E1230; border: 1px solid #262C5E; border-radius: 28px; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), 0 0 60px rgba(76, 107, 255, 0.08)">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h2 id="dlTitle" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 34px; color: #F1EFFA">Log a session</h2>
        <div style="font-size: 13px; color: #9BA0C8">Recorded as just completed</div>
      </div>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; border: none; background: transparent; color: #9BA0C8; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div role="radiogroup" aria-label="Category" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: #070914; border: 1px solid #1C2150">
      <button type="button" role="radio" aria-checked="true" style="height: 44px; border: 1px solid #7FD4FF; border-radius: 20px; background: rgba(127, 212, 255, 0.12); color: #F1EFFA; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Meditation</button>
      <button type="button" role="radio" aria-checked="false" style="height: 44px; border: 1px solid transparent; border-radius: 20px; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Study</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <label for="ddur" style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8">Duration</label>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; align-items: center; gap: 14px">
          <button type="button" aria-label="Five minutes less" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A4180; background: transparent; color: #CFEAFF; font-size: 20px; font-weight: 300; cursor: pointer; padding: 0">−</button>
          <div style="display: flex; align-items: baseline; gap: 6px">
            <input id="ddur" value="45" inputmode="numeric" style="width: 80px; border: none; background: transparent; color: #F1EFFA; font-family: Manrope, sans-serif; font-weight: 200; font-size: 52px; text-align: right; font-variant-numeric: tabular-nums; padding: 0; outline-offset: 4px">
            <span style="font-size: 15px; color: #9BA0C8">min</span>
          </div>
          <button type="button" aria-label="Five minutes more" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A4180; background: transparent; color: #CFEAFF; font-size: 20px; font-weight: 300; cursor: pointer; padding: 0">+</button>
        </div>
        <div style="display: flex; gap: 6px">
          <button type="button" style="height: 36px; width: 44px; border-radius: 18px; border: 1px solid #262C5E; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 13px; cursor: pointer">15</button>
          <button type="button" style="height: 36px; width: 44px; border-radius: 18px; border: 1px solid #262C5E; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 13px; cursor: pointer">30</button>
          <button type="button" style="height: 36px; width: 44px; border-radius: 18px; border: 1px solid #7FD4FF; background: transparent; color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 13px; cursor: pointer">45</button>
          <button type="button" style="height: 36px; width: 44px; border-radius: 18px; border: 1px solid #262C5E; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 13px; cursor: pointer">60</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="dnote" style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8">Note <span style="letter-spacing: 0.04em; text-transform: none; color: #7D83AF">· optional</span></label>
      <textarea id="dnote" rows="3" placeholder="What did you practise?" style="box-sizing: border-box; border: 1px solid #3A4180; border-radius: 14px; background: #070914; color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 14px; padding: 12px 14px; resize: vertical"></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 4px">
      <button type="button" style="height: 52px; padding: 0 24px; border: none; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">Cancel</button>
      <button type="submit" style="height: 52px; padding: 0 32px; border: none; border-radius: 26px; background: #CFEAFF; color: #070914; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 600; box-shadow: 0 0 36px rgba(127, 212, 255, 0.3); cursor: pointer">Add to the heart</button>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
