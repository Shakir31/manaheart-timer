<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070914; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column; padding: 40px 24px 32px; gap: 24px; overflow: hidden">

    </button>
    <button role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border: 1px solid #A98BFF; border-radius: 20px; background: rgba(169, 139, 255, 0.08); color: #E8E6F4; text-align: left; font-family: Manrope, sans-serif; box-shadow: 0 0 30px rgba(169, 139, 255, 0.15); cursor: pointer">
      <dc-import name="Heart" circles="{{ 1 }}" unstable-ring="{{ 0 }}" forming="{{ 0 }}" variant="arcane" size="96px" label="Arcane heart preview" hint-size="96px,96px"></dc-import>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 25px; font-weight: 500; color: #E6DDFF">Arcane</span><span style="font-size: 13px; line-height: 1.4; color: #9BA0C8">Precise glyph circles, violet and cyan</span></span>
      <span aria-hidden="true" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1px solid #A98BFF; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: #C9B8FF; box-shadow: 0 0 8px #A98BFF"></span></span>
    </button>
    <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; border: 1px solid #1C2150; border-radius: 20px; background: #0A0C1C; color: #E8E6F4; text-align: left; font-family: Manrope, sans-serif; cursor: pointer">
      <dc-import name="Heart" circles="{{ 1 }}" unstable-ring="{{ 0 }}" forming="{{ 0 }}" variant="spirit" size="96px" label="Spirit heart preview" hint-size="96px,96px"></dc-import>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 25px; font-weight: 500; color: #E6F5F1">Spirit</span><span style="font-size: 13px; line-height: 1.4; color: #9BA0C8">Soft nebula bands that drift and sway</span></span>
      <span aria-hidden="true" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1px solid #3A4180"></span>
    </button>

  <div style="flex-grow: 1"></div>

</div>
