<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manaheart · Sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mh.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#070914}a{color:#9FDCFF}a:hover{color:#CFEAFF}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #070914; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: -75px; top: -20px; width: 540px">
    <dc-import name="Heart" circles="{{ 3 }}" unstable-ring="{{ 0 }}" forming="{{ 0 }}" dim="{{ 0.22 }}" size="540px" hint-size="540px,540px"></dc-import>
  </div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 0 24px 28px; display: flex; flex-direction: column">
    <div style="height: 172px"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 46px; line-height: 1; letter-spacing: 0.06em; color: #F1EFFA">Manaheart</h1>
      <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #9BA0C8">A quiet place to gather your hours.</div>
    </div>

    <div style="flex-grow: 1"></div>

    <form aria-label="Sign in" style="display: flex; flex-direction: column; gap: 16px">
      <div role="tablist" aria-label="Account" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: rgba(7, 9, 20, 0.8); border: 1px solid #1C2150">
        <button type="button" role="tab" aria-selected="true" style="height: 44px; border: 1px solid #7FD4FF; border-radius: 20px; background: rgba(127, 212, 255, 0.12); color: #F1EFFA; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Sign in</button>
        <button type="button" role="tab" aria-selected="false" style="height: 44px; border: 1px solid transparent; border-radius: 20px; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Create account</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="siE" style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8">Email</label>
        <input id="siE" type="email" autocomplete="email" placeholder="you@example.com" style="height: 48px; box-sizing: border-box; border: 1px solid #3A4180; border-radius: 14px; background: rgba(7, 9, 20, 0.85); color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 15px; padding: 0 14px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="siP" style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8">Password</label>
        <div style="position: relative">
          <input id="siP" type="password" autocomplete="current-password" value="••••••••••" style="width: 100%; height: 48px; box-sizing: border-box; border: 1px solid #3A4180; border-radius: 14px; background: rgba(7, 9, 20, 0.85); color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 15px; padding: 0 52px 0 14px">
          <button type="button" aria-label="Show password" style="position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; border: none; background: transparent; color: #9BA0C8; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"></path><circle cx="12" cy="12" r="2.5"></circle></svg></button>
        </div>
      </div>
      <button type="submit" style="height: 56px; margin-top: 6px; border: none; border-radius: 28px; background: #CFEAFF; color: #070914; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 600; box-shadow: 0 0 36px rgba(127, 212, 255, 0.35); cursor: pointer">Sign in</button>
      <button type="button" style="height: 44px; border: none; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Forgot password?</button>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
