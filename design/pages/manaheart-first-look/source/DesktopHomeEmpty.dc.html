<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manaheart · Home before formation (desktop)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./mh.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Manrope:wght@200;300;400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#070914}a{color:#9BA0C8}a:hover{color:#E8E6F4}</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #070914; color: #E8E6F4; font-family: Manrope, system-ui, sans-serif; padding: 0 clamp(16px, 4vw, 48px); overflow: hidden">
  <header style="max-width: 1200px; margin: 0 auto; height: 80px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #141838">
    <div style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 500; letter-spacing: 0.1em">Manaheart</div>
    <nav aria-label="Main" style="display: flex; align-items: center; gap: 4px">
      <a href="DesktopHomeEmpty.dc.html" aria-current="page" style="height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 14px; font-weight: 600; color: #F1EFFA; text-decoration: none; box-shadow: inset 0 -1px 0 #7FD4FF">Heart</a>
      <a href="DesktopSessions.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 14px; font-size: 14px; font-weight: 500; text-decoration: none">Sessions</a>
      <a href="DesktopSettings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; margin-left: 8px; color: #9BA0C8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 72px; padding: 40px 0 56px">
    <div style="flex: 999 1 520px; min-width: 0; display: flex; justify-content: center">
      <dc-import name="Heart" phase="gathering" size="620px" label="Faint sparks gathering; the heart has not formed yet" hint-size="620px,620px"></dc-import>
    </div>

    <div style="flex: 1 1 340px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #9BA0C8">Before formation</div>
        <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 64px; line-height: 1; color: #F1EFFA">Gathering</h1>
        <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #9BA0C8">Sparks drift closer with every session.</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
          <div style="font-size: 14px">Heart forming</div>
          <div style="font-size: 14px; color: #9BA0C8; font-variant-numeric: tabular-nums">4h 10m <span style="color: #7D83AF">/ 5h until your heart forms</span></div>
        </div>
        <div role="progressbar" aria-label="Heart forming" aria-valuemin="0" aria-valuemax="300" aria-valuenow="250" style="height: 2px; background: #1D2350; border-radius: 2px; position: relative">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 83%; background: #9FDCFF; border-radius: 2px; box-shadow: 0 0 10px #7FD4FF; opacity: 0.85"></div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 18px 20px; border: 1px solid #1C2150; border-radius: 18px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8">Rhythm</div>
          <div style="font-size: 14px">4 of 7 days</div>
        </div>
        <div style="display: flex; gap: 12px" role="img" aria-label="Practised 4 of the last 7 days; today not yet">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">W</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px solid #5A619A"></div><div style="font-size: 11px; color: #7D83AF">T</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">F</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">S</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px solid #5A619A"></div><div style="font-size: 11px; color: #7D83AF">S</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">M</div></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px dashed #9FDCFF"></div><div style="font-size: 11px; color: #E8E6F4; font-weight: 600">T</div></div>
        </div>
      </div>

      <div style="display: flex; gap: 12px; flex-wrap: wrap">
        <button style="flex: 1 1 200px; height: 56px; border: none; border-radius: 28px; background: #CFEAFF; color: #070914; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 600; box-shadow: 0 0 36px rgba(127, 212, 255, 0.35); cursor: pointer">Begin session</button>
        <button style="flex: 0 1 160px; height: 56px; border: 1px solid #3A4180; border-radius: 28px; background: transparent; color: #E8E6F4; font-family: Manrope, sans-serif; font-size: 15px; font-weight: 500; cursor: pointer">Log manually</button>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
