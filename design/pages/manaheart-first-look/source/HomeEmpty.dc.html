<helmet>

  <div style="display: flex; justify-content: space-between; align-items: center; height: 48px">

    <button aria-label="Settings" style="width: 44px; height: 44px; border: none; background: transparent; color: #9BA0C8; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; margin-top: 18px">
    <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: #9BA0C8">Before formation</div>
    <h1 style="margin: 6px 0 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 40px; line-height: 1; color: #F1EFFA">Gathering</h1>

    <dc-import name="Heart" phase="gathering" size="316px" label="Faint sparks gathering; the heart has not formed yet" hint-size="316px,316px"></dc-import>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px">Heart forming</div>
      <div style="font-size: 13px; color: #9BA0C8; font-variant-numeric: tabular-nums">4h 10m <span style="color: #7D83AF">/ 5h until your heart forms</span></div>
    </div>
    <div role="progressbar" aria-label="Heart forming" aria-valuemin="0" aria-valuemax="300" aria-valuenow="250" style="height: 2px; background: #1D2350; border-radius: 2px; position: relative">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 83%; background: #9FDCFF; border-radius: 2px; box-shadow: 0 0 10px #7FD4FF; opacity: 0.85"></div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 14px 16px; border: 1px solid #1C2150; border-radius: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 11px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: #9BA0C8">Rhythm</div>
      <div style="font-size: 13px">4 of 7 days</div>
    </div>
    <div style="display: flex; gap: 10px" role="img" aria-label="Practised 4 of the last 7 days; today not yet">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">W</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px solid #5A619A"></div><div style="font-size: 11px; color: #7D83AF">T</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">F</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">S</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px solid #5A619A"></div><div style="font-size: 11px; color: #7D83AF">S</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></div><div style="font-size: 11px; color: #7D83AF">M</div></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><div style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 1px dashed #9FDCFF"></div><div style="font-size: 11px; color: #E8E6F4; font-weight: 600">T</div></div>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <button style="height: 56px; border: none; border-radius: 28px; background: #CFEAFF; color: #070914; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 600; box-shadow: 0 0 36px rgba(127, 212, 255, 0.35); cursor: pointer">Begin session</button>
    <button style="height: 44px; border: none; background: transparent; color: #9BA0C8; font-family: Manrope, sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">Log manually</button>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box; padding-bottom: 8px; border-top: 1px solid #141838; background: rgba(7, 9, 20, 0.94); display: flex; justify-content: center">
    <a href="HomeEmpty.dc.html" aria-current="page" style="width: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #F1EFFA; text-decoration: none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7FD4FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-20 12 12)"></ellipse><path d="M12 7.5l2.6 4.5-2.6 4.5-2.6-4.5z"></path></svg>Heart<span style="width: 4px; height: 4px; border-radius: 50%; background: #7FD4FF; box-shadow: 0 0 6px #7FD4FF"></span></a>

  </nav>
</div>
