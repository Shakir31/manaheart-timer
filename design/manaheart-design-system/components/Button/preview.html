<!-- @dsCard group="Actions" height=420 subtitle="Primary, outline, destructive, ghost and icon buttons in every state" -->
<div style="background: var(--page); color: var(--text-body); font-family: var(--font-sans); padding: 24px; display: grid; grid-template-columns: 110px repeat(6, minmax(0, 1fr)); gap: 14px 12px; align-items: center">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Manrope:wght@200;400;500;600&display=swap">
  <style>
    .h { font-size: 10px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; color: var(--text-tertiary) }
    .n { font-family: var(--font-display); font-size: 19px; color: var(--text-primary) }
    .b { height: 48px; border-radius: var(--radius-pill); font-family: var(--font-sans); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100% }
    .p { border: none; background: var(--primary); color: var(--on-primary); font-weight: 600; box-shadow: var(--glow-primary) }
    .o { border: 1px solid var(--control-edge); background: transparent; color: var(--text-body); font-weight: 500 }
    .d { border: 1px solid var(--error-edge); background: var(--error-ground); color: var(--error); font-weight: 600 }
    .g { border: none; background: transparent; color: var(--text-secondary); font-weight: 500; height: 44px }
    .f { outline: 2px solid var(--focus); outline-offset: 3px }
    .spin { animation: s 1.1s linear infinite } @keyframes s { to { transform: rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none } }
  </style>
  <span></span><span class="h">Default</span><span class="h">Hover</span><span class="h">Focus</span><span class="h">Pressed</span><span class="h">Disabled</span><span class="h">Loading</span>

  <span class="n">Primary</span>
  <button class="b p">Begin session</button>
  <button class="b p" style="background: var(--primary-hover); box-shadow: 0 0 48px rgba(127,212,255,.5)">Begin session</button>
  <button class="b p f">Begin session</button>
  <button class="b p" style="background: var(--primary-pressed); box-shadow: 0 0 16px rgba(127,212,255,.25); transform: scale(.98)">Begin session</button>
  <button class="b" disabled style="border: none; background: var(--track); color: var(--text-tertiary); font-weight: 600">Begin session</button>
  <button class="b p" aria-busy="true"><svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9"></path></svg>Saving</button>

  <span class="n">Outline</span>
  <button class="b o">End session</button>
  <button class="b o" style="border-color: var(--mana); background: rgba(127,212,255,.06); color: var(--text-primary)">End session</button>
  <button class="b o f">End session</button>
  <button class="b o" style="border-color: var(--mana-soft); background: rgba(127,212,255,.12); transform: scale(.98)">End session</button>
  <button class="b o" disabled style="border-color: var(--hairline); color: var(--text-tertiary); opacity: .7">End session</button>
  <button class="b o" aria-busy="true"><svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--mana)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9"></path></svg>Exporting</button>

  <span class="n">Destructive</span>
  <button class="b d">Delete</button>
  <button class="b d" style="border-color: var(--error); background: #3a1840">Delete</button>
  <button class="b d f">Delete</button>
  <button class="b d" style="border-color: var(--error); background: #200c25; transform: scale(.98)">Delete</button>
  <button class="b d" disabled style="border-color: #2a1f3a; background: #140e22; color: var(--text-tertiary)">Delete</button>
  <button class="b d" aria-busy="true"><svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 0 1 9 9"></path></svg>Deleting</button>

  <span class="n">Ghost</span>
  <button class="b g">Log manually</button>
  <button class="b g" style="background: rgba(232,230,244,.05); color: var(--text-body)">Log manually</button>
  <button class="b g f">Log manually</button>
  <button class="b g" style="background: rgba(127,212,255,.1); color: var(--text-primary)">Log manually</button>
  <button class="b g" disabled style="color: var(--rhythm-missed)">Log manually</button>
  <span class="h" style="text-align: center">n/a</span>

  <span class="n">Icon</span>
  <button class="b g" aria-label="Settings" style="width: 44px; justify-self: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  <button class="b g" aria-label="Settings" style="width: 44px; justify-self: center; background: rgba(232,230,244,.06); color: var(--text-body)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  <button class="b g f" aria-label="Settings" style="width: 44px; justify-self: center; outline-offset: 1px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  <button class="b" aria-label="Pause" style="width: 56px; height: 56px; justify-self: center; border: 1px solid var(--mana-soft); background: rgba(127,212,255,.08); color: var(--primary); box-shadow: 0 0 24px rgba(127,212,255,.25)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg></button>
  <button class="b g" disabled aria-label="Settings" style="width: 44px; justify-self: center; color: var(--control-edge)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></button>
  <span class="h" style="text-align: center">n/a</span>
</div>
<script></script>
