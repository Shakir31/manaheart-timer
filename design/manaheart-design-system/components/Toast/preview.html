<!-- @dsCard group="Feedback" height=210 subtitle="Success, neutral with undo, error with retry" -->
<div style="background: var(--page); color: var(--text-body); font-family: var(--font-sans); font-size: 14px; padding: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 460px">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap">
  <style>
    .t { display: flex; align-items: center; gap: 12px; border-radius: 16px; background: var(--sheet); box-shadow: 0 12px 40px rgba(0,0,0,.5); padding: 6px 6px 6px 16px; min-height: 44px }
    .a { height: 40px; padding: 0 14px; border: none; border-radius: var(--radius-pill); background: transparent; font-family: var(--font-sans); font-size: 14px; font-weight: 600; cursor: pointer }
  </style>
  <div role="status" class="t" style="border: 1px solid var(--success-edge)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg><span style="flex-grow: 1">Session saved · +45 min</span></div>
  <div role="status" class="t" style="border: 1px solid var(--edge-subtle)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg><span style="flex-grow: 1">Session deleted</span><button class="a" style="color: var(--mana-soft)">Undo</button></div>
  <div role="alert" class="t" style="border: 1px solid var(--error-edge)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5v.1"></path></svg><span style="flex-grow: 1">Couldn't save. Check your connection.</span><button class="a" style="color: var(--error)">Retry</button></div>
</div>
<script></script>
