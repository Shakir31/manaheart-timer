<!-- @dsCard group="Surfaces" height=300 subtitle="Delete confirmation" -->
<div style="background: var(--page); font-family: var(--font-sans); padding: 24px; display: flex; justify-content: center">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500;600&display=swap">
  <div role="alertdialog" aria-labelledby="cT" aria-describedby="cB" style="width: 100%; max-width: 380px; box-sizing: border-box; background: var(--sheet); border: 1px solid var(--edge-subtle); border-radius: var(--radius-dialog); padding: 26px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-modal)">
    <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--error-edge); background: var(--error-ground); color: var(--error); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"></path></svg></div>
    <div id="cT" style="font-family: var(--font-display); font-weight: 500; font-size: 28px; color: var(--text-primary)">Delete this session?</div>
    <div id="cB" style="font-size: 14px; line-height: 1.55; color: var(--text-secondary)">45 min of Study from today will be removed, and the heart will lose that mana. This can't be undone.</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px">
      <button style="height: 48px; border: 1px solid var(--control-edge); border-radius: var(--radius-pill); background: transparent; color: var(--text-body); font-family: var(--font-sans); font-size: 14px; font-weight: 500">Keep it</button>
      <button style="height: 48px; border: 1px solid var(--error-edge); border-radius: var(--radius-pill); background: var(--error-ground); color: var(--error); font-family: var(--font-sans); font-size: 14px; font-weight: 600">Delete</button>
    </div>
  </div>
</div>
<script></script>
